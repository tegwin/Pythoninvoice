{% extends "base.html" %}

{% block title %}Submit Feature Request{% endblock %}

{% block content %}
<div class="page-header">
    <h1>📝 Submit Feature Request</h1>
    <p>Help us improve by suggesting new features</p>
</div>

<div class="panel" style="max-width: 600px; margin: 0 auto;">
    <form method="POST">
        <div class="form-group">
            <label class="form-label" for="title">Feature Title *</label>
            <input type="text" id="title" name="title" class="form-control" required
                   placeholder="e.g., Add recurring invoice support">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="description">Description</label>
            <textarea id="description" name="description" class="form-control"
                      placeholder="Describe the feature in detail. What problem does it solve? How would it work?"></textarea>
        </div>
        
        <div class="form-group">
            <label class="form-label" for="name">Your Name</label>
            <input type="text" id="name" name="name" class="form-control" placeholder="John Smith">
        </div>
        
        <div class="form-group">
            <label class="form-label" for="email">Your Email</label>
            <input type="email" id="email" name="email" class="form-control" placeholder="john@example.com">
            <small class="text-muted">We'll notify you if your feature is added</small>
        </div>
        
        <div class="flex gap-2 mt-4">
            <button type="submit" class="btn btn-primary">📤 Submit Request</button>
            <a href="{{ url_for('index') }}" class="btn btn-secondary">Cancel</a>
        </div>
    </form>
</div>
{% endblock %}
