{% extends "base.html" %}

{% block title %}Admin Login{% endblock %}

{% block content %}
<div class="page-header">
    <h1>🔐 Admin Login</h1>
    <p>Vendor access only</p>
</div>

<div class="panel" style="max-width: 400px; margin: 0 auto;">
    <div style="background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 8px; padding: 1rem; margin-bottom: 1.5rem;">
        <strong style="color: #ef4444;">⚠️ Vendor Only</strong>
        <p style="margin: 0.5rem 0 0 0; font-size: 0.9rem; color: var(--text-secondary);">
            This admin panel is for the software vendor only.
        </p>
    </div>
    
    <form method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group">
            <label class="form-label" for="password">Admin Password</label>
            <input type="password" id="password" name="password" class="form-control" required autofocus>
        </div>
        
        <button type="submit" class="btn btn-primary" style="width: 100%;">Login</button>
    </form>
    
    <div style="margin-top: 1.5rem; text-align: center;">
        <a href="{{ url_for('index') }}" style="color: var(--text-secondary);">← Back to Roadmap</a>
    </div>
</div>
{% endblock %}
